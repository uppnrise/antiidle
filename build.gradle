plugins {
    id 'java'
    id 'application'
    id 'distribution'
    id 'checkstyle'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.11'
}

group = 'com.upp'
version = '2.0.0'
description = 'A Java application for preventing idle time'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

application {
    mainClass = 'com.upp.AntiIdleGUI'
    applicationName = 'antiidle'
    applicationDefaultJvmArgs = [
        '-Djava.awt.headless=false',
        '-Dapple.awt.UIElement=true'
    ]
}

repositories {
    mavenCentral()
}

dependencies {
    // Main dependencies
    // NOTE: Jackson 3.x uses the new 'tools.jackson' groupId/package (com.fasterxml.jackson.* is
    // Jackson 2.x). jackson-annotations stays on the com.fasterxml.jackson.core groupId and is
    // pulled in transitively by jackson-databind.
    implementation 'tools.jackson.core:jackson-databind:3.2.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml:3.2.2'
    implementation 'org.slf4j:slf4j-api:2.0.19'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    
    // Modern UI - FlatLaf
    implementation 'com.formdev:flatlaf:3.7.2'
    implementation 'com.formdev:flatlaf-intellij-themes:3.7.2'
    
    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    
    // SpotBugs annotations
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.4'
}

tasks.named('test') {
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    
    systemProperties = [
        'java.awt.headless': 'true'
    ]
    
    // Increase timeout for GUI tests
    timeout = Duration.ofMinutes(5)
}

jar {
    archiveFileName = "${project.name}-${project.version}.jar"
    
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Implementation-Title': project.description,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Burhanettin Nacar',
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().toString(),
            'Built-JDK': System.getProperty('java.version')
        )
    }
}

// Create fat JAR
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Creates a fat JAR with all dependencies'
    
    archiveFileName = "${project.name}-${project.version}-all.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Implementation-Title': project.description,
            'Implementation-Version': project.version
        )
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

// Distribution configuration
distributions {
    main {
        distributionBaseName = project.name
        contents {
            from(fatJar)
            from('README.md', 'LICENSE.md', 'CHANGELOG.md')
        }
    }
}

// Checkstyle configuration
checkstyle {
    toolVersion = '14.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}

// SpotBugs configuration
spotbugs {
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/exclude.xml')
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.html")
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.xml")
        }
    }
}

// JaCoCo configuration
jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/Main.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.7
            }
        }
    }
}

// Custom tasks
tasks.register('runGui') {
    group = 'application'
    description = 'Runs the AntiIdle GUI application'
    dependsOn 'classes'
    
    doLast {
        javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = application.mainClass
            systemProperty 'java.awt.headless', 'false'
        }
    }
}

tasks.register('createStartScripts', CreateStartScripts) {
    group = 'distribution'
    description = 'Creates start scripts for the application'
    
    outputDir = file('scripts')
    mainClass = application.mainClass
    applicationName = 'antiidle'
    classpath = configurations.runtimeClasspath + files(jar.archiveFile)
    
    doLast {
        // Customize scripts if needed
        def unixScript = file("scripts/${applicationName}")
        def windowsScript = file("scripts/${applicationName}.bat")
        
        if (unixScript.exists()) {
            def text = unixScript.text
            text = text.replace('java.awt.headless=true', 'java.awt.headless=false')
            unixScript.text = text
        }
        
        if (windowsScript.exists()) {
            def text = windowsScript.text
            text = text.replace('java.awt.headless=true', 'java.awt.headless=false')
            windowsScript.text = text
        }
    }
}

// Ensure fat JAR is built with main build
build.dependsOn fatJar
distZip.dependsOn createStartScripts
distTar.dependsOn createStartScripts

// Clean up
clean {
    delete 'scripts'
}
